<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>QC 扫码质检</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>QC 扫码质检</h1>
      <p>扫码 · 判定 · 提交 · 导出 Excel</p>
    </div>
  </header>

  <main class="container">
    <div class="storage-warning hidden" id="storage-warning"></div>
    <!-- ① 扫码 -->
    <section class="card">
      <div class="card-head">
        <h2>① 扫描产品二维码</h2>
        <button id="toggle-manual" class="link-btn" type="button">手动输入</button>
      </div>
      <div class="reader-wrap hidden" id="reader-wrap">
        <div id="reader" class="reader"></div>
      </div>
      <div class="zoom-panel hidden" id="zoom-panel">
        <span class="zoom-label">放大</span>
        <div class="zoom-btns" id="zoom-btns">
          <button class="zoom-btn active" data-zoom="1" type="button">1×</button>
          <button class="zoom-btn" data-zoom="3" type="button">3×</button>
          <button class="zoom-btn" data-zoom="5" type="button">5×</button>
        </div>
        <span class="zoom-mode-tip" id="zoom-mode-tip"></span>
      </div>
      <div class="scan-actions">
        <button id="btn-start" class="btn btn-primary" type="button">开始扫码</button>
        <button id="btn-stop" class="btn btn-ghost hidden" type="button">停止扫码</button>
      </div>
      <form id="manual-form" class="manual-form hidden">
        <input id="manual-input" type="text" placeholder="请输入产品编号" autocomplete="off" />
        <button type="submit" class="btn btn-ghost">确定</button>
      </form>
      <p class="tip">扫码需要摄像头权限，请在 HTTPS 或 localhost 环境下使用；摄像头不可用时可手动输入编号。二维码较小或距离较远时，可点按"放大"提高识别率。</p>
    </section>

    <!-- ② 判定 -->
    <section class="card" id="result-card">
      <div class="card-head">
        <h2>② 质检判定</h2>
      </div>
      <p class="empty-tip" id="empty-tip">扫描或输入产品编号后，在此选择质检结果</p>
      <div id="result-body" class="hidden">
        <div class="code-box">
          <span class="code-label">产品编号</span>
          <span class="code-text" id="code-text"></span>
        </div>
        <p class="override-tip hidden" id="override-tip"></p>
        <div class="choice">
          <button class="choice-btn pass" id="btn-pass" type="button">合格</button>
          <button class="choice-btn fail" id="btn-fail" type="button">不合格</button>
        </div>
        <button class="btn btn-primary btn-block" id="btn-submit" type="button" disabled>确认提交</button>
      </div>
    </section>

    <!-- ③ 记录与导出 -->
    <section class="card">
      <div class="card-head">
        <h2>③ 记录与导出</h2>
        <span class="stats" id="stats"></span>
      </div>
      <div class="table-wrap">
        <table class="record-table">
          <thead>
            <tr>
              <th>产品编号</th>
              <th>结果</th>
              <th>扫码时间</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="record-tbody"></tbody>
        </table>
      </div>
      <div class="export-actions">
        <button class="btn btn-success" id="btn-export" type="button">导出 Excel</button>
        <button class="btn btn-danger-ghost" id="btn-clear" type="button">清空记录</button>
      </div>
      <p class="tip">同一产品编号重复提交时将覆盖旧记录。数据保存在本机浏览器中，请及时导出 Excel 备份。</p>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
